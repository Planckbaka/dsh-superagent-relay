name: Release readiness

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, build and inspect package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install declared package manager
        run: npm install --global pnpm@11.7.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build
        run: pnpm check
      - name: Inspect exact distribution archive
        run: |
          pnpm pack --pack-destination .artifacts/ci
          python3 scripts/verify-release.py .artifacts/ci/dsh-superagent-relay-*.tgz --version "$(node -p 'require("./package.json").version')" --output .artifacts/ci/verification.json
